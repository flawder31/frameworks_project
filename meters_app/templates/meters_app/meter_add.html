{% extends "base.html" %}
{% block title %}Добавить счетчик{% endblock %}

{% block content %}
<h1>Добавить новый счетчик</h1>

<form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
    
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors|join:", " }}</div>
            {% endif %}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary w-100">Добавить счетчик</button>
</form>
<a href="{% url 'meters:list' %}" class="btn btn-secondary mt-3">Назад</a>
{% endblock %}
