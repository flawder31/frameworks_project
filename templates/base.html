{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис счетчиков{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Свой CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <!-- Навигация (подключаем include) -->
    {% include "includes/navigation.html" %}

    <main class="container bg-white p-4 rounded shadow-sm mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3 text-center text-muted">
        <p>© <span id="current-year"></span> Сервис учета показаний</p>
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
