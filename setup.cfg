[flake8]
exclude =
    .venv,
    venv,
    __pycache__,
    .git,
    .pytest_cache,
    migrations,
    meterly/settings.py,
    */migrations/*,
    */admin.py,
    */apps.py,
    */models.py,     ; <--- это Django-модели, они нам пока не нужны
    */tests.py       ; <--- Django-тесты, они нам пока не нужны
max-line-length = 79
extend-ignore = E501