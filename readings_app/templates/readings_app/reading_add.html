{% extends "base.html" %}

{% block title %}Внести показание{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Внести новое показание</h2>
            
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" class="card p-4 shadow-sm">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="meter_code" class="form-label">Выберите счетчик</label>
                    <select name="meter_code" id="meter_code" class="form-select" required>
                        <option value="">-- Выберите --</option>
                        {% for m in meters %}
                            <option value="{{ m.code }}">{{ m.name }} ({{ m.code }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="previous" class="form-label">Предыдущее показание</label>
                    <input type="number" step="0.01" name="previous" id="previous" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="current" class="form-label">Текущее показание</label>
                    <input type="number" step="0.01" name="current" id="current" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="reading_date" class="form-label">Дата снятия</label>
                    <input type="date" name="reading_date" id="reading_date" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Рассчитать и сохранить</button>
                <a href="{% url 'homepage:index' %}" class="btn btn-link w-100 mt-2">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
